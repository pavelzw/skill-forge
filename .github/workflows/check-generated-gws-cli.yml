name: Check generated gws-cli recipe
on:
  push:
    branches: [main]
    paths:
      - recipes/gws-cli/**
  pull_request:
    paths:
      - recipes/gws-cli/**

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Check gws-cli recipe is up to date
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Pixi
        uses: prefix-dev/setup-pixi@a09b6247153796b190642a2b53fac4241043cf6f # v0.10.0
      - name: Regenerate recipe
        run: pixi run generate-gws-cli
      - name: Check for differences
        run: git diff --exit-code recipes/gws-cli/recipe.yaml recipes/gws-cli/SKILLS.md
